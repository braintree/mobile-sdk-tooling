name: PR Review Digest

on:
  schedule:
    # 9:00 AM Central (CDT = UTC-5). Update to '0 15 * * 1-5' when clocks fall back to CST (UTC-6) in November.
    - cron: '0 14 * * 1-5'
    # 3:00 PM Central (CDT = UTC-5). Update to '0 21 * * 1-5' when clocks fall back to CST (UTC-6) in November.
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

jobs:
  digest:
    name: Post PR review digest to Slack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ── Step 1: Authenticate as the GitHub App ─────────────────────────────
      # This action handles JWT generation and token exchange automatically.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Scopes the token to the whole org so it can read any repo with our GH app installed.
          owner: ${{ github.repository_owner }}

      # ── Step 2: Check out this repo to read its CODEOWNERS file ───────────
      - name: Check out repo
        uses: actions/checkout@v4

      # ── Step 3: Find PRs needing review and post digest to Slack ───────────
      - name: Find PRs needing review and post to Slack
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Stored as Actions Variables
          REPOS: ${{ vars.REPOS }}
        run: |
          set -euo pipefail
          
          NL=$'\n'

          # Each bucket collects "<createdAt>\t<line>" entries so they can be sorted
          # oldest-to-newest (Slack's plain-text webhook message has no color coding).
          ASSIGNED_TOTAL=0
          ASSIGNED_ENTRIES=""

          SECOND_TOTAL=0
          SECOND_ENTRIES=""

          MERGE_TOTAL=0
          MERGE_ENTRIES=""

          # ── Read code owners from this repo's CODEOWNERS file ─────────────
          # Extracts individual @username entries only — @org/team refs are skipped
          # since we're matching against individual reviewer logins on PRs.
          CODE_OWNERS=""
          for CO_PATH in ".github/CODEOWNERS" "CODEOWNERS" "docs/CODEOWNERS"; do
            if [[ -f "$CO_PATH" ]]; then
              CODE_OWNERS=$(grep -v '^\s*#' "$CO_PATH" \
                | grep -oP '(?<=@)[a-zA-Z0-9][a-zA-Z0-9_-]*(?!\/)' \
                | sort -u | tr '\n' ' ')
              echo "CODEOWNERS loaded from ${CO_PATH}: ${CODE_OWNERS}"
              break
            fi
          done
          [[ -z "$CODE_OWNERS" ]] && echo "No CODEOWNERS file found — all reviews will count"
          
          if [[ -z "$REPOS" ]]; then
            echo "REPOS variable is empty — Please set it to a comma-separated list of repositories (e.g. 'org/repo1, org/repo2') in Actions Variables."
            exit 0
          fi
          
          IFS=',' read -ra REPO_LIST <<< "$REPOS"
          
          for REPO in "${REPO_LIST[@]}"; do
            REPO="${REPO// /}"
            [[ -z "$REPO" ]] && continue
            echo "Scanning: $REPO"
          
            # mergeStateStatus = CLEAN means approved, checks pass, no conflicts
            PRS=$(gh pr list \
              --repo "$REPO" \
              --state open \
              --limit 100 \
              --json number,title,url,createdAt,isDraft,mergeStateStatus,labels,reviewRequests)

            PR_COUNT=$(echo "$PRS" | jq 'length')
            [[ "$PR_COUNT" -eq 0 ]] && continue

            for i in $(seq 0 $((PR_COUNT - 1))); do
              PR=$(echo "$PRS" | jq ".[$i]")

              # Skip draft PRs — not ready for review
              IS_DRAFT=$(echo "$PR" | jq -r '.isDraft')
              [[ "$IS_DRAFT" == "true" ]] && continue

              NUMBER=$(echo "$PR"      | jq -r '.number')
              TITLE=$(echo "$PR"       | jq -r '.title' | sed 's/[][|>]/ /g')
              URL=$(echo "$PR"         | jq -r '.url')
              CREATED_AT=$(echo "$PR"  | jq -r '.createdAt')

              # ── Check for inner source label (case-insensitive) ─────────
              IS_INNER_SOURCE=$(echo "$PR" | jq -r \
                '[.labels[].name | ascii_downcase] | contains(["inner source"])')

              # ── Check for tech lead review required label (case-insensitive) ─
              NEEDS_TECH_LEAD=$(echo "$PR" | jq -r \
                '[.labels[].name | ascii_downcase] | contains(["tech lead review required"])')

              # Inner source PRs still awaiting tech lead review aren't actionable
              # by the broader team yet — hide them entirely, on any day.
              if [[ "$IS_INNER_SOURCE" == "true" && "$NEEDS_TECH_LEAD" == "true" ]]; then
                continue
              fi

              # ── Resolve each reviewer's latest decision ─────────────────
              # The list query's latestReviews reports each reviewer's most recent review of ANY
              # type, so a COMMENTED reply submitted after an approval hides that approval. Fetch
              # the full review history and reduce to each reviewer's latest DECISIVE review
              # (APPROVED / CHANGES_REQUESTED / DISMISSED), ignoring COMMENTED/PENDING. A dismissed
              # approval correctly stops counting because DISMISSED can be a reviewer's latest
              # decision. This mirrors how GitHub itself tracks approval state.
              LATEST_DECISIONS=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews?per_page=100" 2>/dev/null \
                | jq -s '
                    (add // [])
                    | [ .[]
                        | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
                        | {login: .user.login, state: .state, submittedAt: .submitted_at}
                      ]
                    | group_by(.login)
                    | map(sort_by(.submittedAt) | last)
                  ' || echo '[]')
          
              # ── Skip PRs with unaddressed change requests ───────────────
              # Latest CHANGES_REQUESTED timestamp from a relevant reviewer (code owners when a
              # CODEOWNERS file exists, otherwise any reviewer); empty when there is none.
              CHANGES_REQUESTED_AT=$(echo "$LATEST_DECISIONS" | jq -r --arg owners "$CODE_OWNERS" '
                ($owners | split(" ") | map(select(length > 0))) as $owner_list |
                [.[]
                  | select(.state == "CHANGES_REQUESTED")
                  | select(($owner_list | length == 0)
                           or (.login as $l | $owner_list | contains([$l])))
                  | .submittedAt
                ] | max // ""')

              if [[ -n "$CHANGES_REQUESTED_AT" ]]; then
                # Fetch commits for this single PR only. Requesting `commits` for every PR in the
                # list query above blows GitHub's GraphQL node limit via the commit authors
                # connection, so we look it up lazily and only when a change request exists.
                LAST_COMMIT_DATE=$(gh pr view "$NUMBER" --repo "$REPO" --json commits \
                  --jq '[.commits[].committedDate] | max // ""' 2>/dev/null || true)
                # If the latest commit is not newer than the change request, the PR is waiting on
                # the author, not reviewers — drop it. On a lookup failure (empty date) we keep
                # the PR rather than hide it.
                if [[ -n "$LAST_COMMIT_DATE" && ! "$LAST_COMMIT_DATE" > "$CHANGES_REQUESTED_AT" ]]; then
                  continue
                fi
              fi

              # ── Count code owner approvals (all approvals when no CODEOWNERS) ──
              REVIEW_COUNT=$(echo "$LATEST_DECISIONS" | jq --arg owners "$CODE_OWNERS" '
                ($owners | split(" ") | map(select(length > 0))) as $owner_list |
                [.[]
                  | select(.state == "APPROVED")
                  | select(($owner_list | length == 0)
                           or (.login as $l | $owner_list | contains([$l])))] | length
              ')

              # First code-owner approver, by earliest submittedAt — the reviewer credited
              # on the line once a PR has moved past "awaiting assigned reviewer".
              FIRST_APPROVER=$(echo "$LATEST_DECISIONS" | jq -r --arg owners "$CODE_OWNERS" '
                ($owners | split(" ") | map(select(length > 0))) as $owner_list |
                [.[]
                  | select(.state == "APPROVED")
                  | select(($owner_list | length == 0)
                           or (.login as $l | $owner_list | contains([$l])))]
                | sort_by(.submittedAt) | .[0].login // ""
              ')

              # All individually assigned reviewers (teams don't count — we need logins to tag).
              # A PR can have zero (nobody requested yet, or only a team was requested) — it still
              # belongs in the digest, just without an @mention.
              ASSIGNED_REVIEWERS=$(echo "$PR" | jq -r \
                '[.reviewRequests[] | select(.__typename == "User") | .login] | join(" ")')

              MERGE_STATE=$(echo "$PR" | jq -r '.mergeStateStatus')

              # Labels
              LABELS=$(echo "$PR" | jq -r '[.labels[].name] | join(", ")')
              if [[ -n "$LABELS" ]]; then
                LABEL_STR=" · 🏷️ ${LABELS}"
              else
                LABEL_STR=""
              fi

              # ── Route PR to the appropriate bucket ───────────────────────
              # Bare URL (not Markdown [text](url) — that doesn't render in the Workflow Builder
              # message, it shows literally and pulls the trailing ")" into the auto-detected
              # link) so Slack still auto-links it even inline with the rest of the line.
              if [[ $REVIEW_COUNT -eq 0 ]]; then
                if [[ -n "$ASSIGNED_REVIEWERS" ]]; then
                  REVIEWER_TAGS="@${ASSIGNED_REVIEWERS// /, @}"
                  PR_LINE="• ${TITLE} — ${URL} — ${REVIEWER_TAGS}${LABEL_STR}"
                else
                  PR_LINE="• ${TITLE} — ${URL}${LABEL_STR}"
                fi
                ASSIGNED_ENTRIES+="${CREATED_AT}$(printf '\t')${PR_LINE}${NL}"
                ((ASSIGNED_TOTAL++)) || true
              elif [[ $REVIEW_COUNT -eq 1 ]]; then
                PR_LINE="• ${TITLE} — ${URL} — Already reviewed by: @${FIRST_APPROVER}${LABEL_STR}"
                SECOND_ENTRIES+="${CREATED_AT}$(printf '\t')${PR_LINE}${NL}"
                ((SECOND_TOTAL++)) || true
              elif [[ "$MERGE_STATE" == "CLEAN" ]]; then
                PR_LINE="• ${TITLE} — ${URL}${LABEL_STR}"
                MERGE_ENTRIES+="${CREATED_AT}$(printf '\t')${PR_LINE}${NL}"
                ((MERGE_TOTAL++)) || true
              fi
              # 2+ approvals but not mergeable (conflicts/failing checks): blocked on
              # something other than a reviewer, so it's left out of the digest.
            done
          done

          # Sort each bucket oldest-to-newest by createdAt, then strip the sort key.
          sort_entries() {
            [[ -z "$1" ]] && return
            printf '%s' "$1" | sort | cut -f2-
          }

          ASSIGNED_BODY=$(sort_entries "$ASSIGNED_ENTRIES")
          SECOND_BODY=$(sort_entries "$SECOND_ENTRIES")
          MERGE_BODY=$(sort_entries "$MERGE_ENTRIES")

          # ── Build and send Slack message ──────────────────────────────────
          DATE_LABEL=$(date '+%A, %B %-d')
          SLACK_TEXT=""

          if [[ $ASSIGNED_TOTAL -gt 0 ]]; then
            SLACK_TEXT+="🎯 Assigned Reviewer${NL}${ASSIGNED_BODY}${NL}"
          fi

          if [[ $SECOND_TOTAL -gt 0 ]]; then
            SLACK_TEXT+="👀 Ready for Second Review${NL}${SECOND_BODY}${NL}"
          fi

          if [[ $MERGE_TOTAL -gt 0 ]]; then
            SLACK_TEXT+="✅ Ready to Merge${NL}${MERGE_BODY}${NL}"
          fi

          if [[ -n "$SLACK_TEXT" ]]; then
            SLACK_TEXT="🔍 PR Review Digest — ${DATE_LABEL}${NL}${NL}${SLACK_TEXT}"
          else
            SLACK_TEXT="✅ PR Review Digest — ${DATE_LABEL} — All clear! There are no PRs currently needing attention."
          fi

          # Slack Workflow expects a variable named "message" in the payload.
          PAYLOAD=$(jq -n --arg message "$SLACK_TEXT" '{"message": $message}')

          curl -sf -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL" > /dev/null

          echo "Done. Posted ${ASSIGNED_TOTAL} assigned, ${SECOND_TOTAL} ready-for-second-review, ${MERGE_TOTAL} ready-to-merge PR(s) to Slack."
